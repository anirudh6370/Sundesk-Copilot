<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- thread -->
  <rect x="6" y="10" width="300" height="230" rx="12" fill="#FFF7E6" stroke="#F59E0B" stroke-width="2"/>
  <text x="24" y="36" font-size="12" font-weight="700" fill="#B45309" letter-spacing="1">ONE CHAT THREAD</text>
  <rect x="24" y="50" width="200" height="30" rx="15" fill="#0F2A43"/>
  <text x="124" y="70" text-anchor="middle" font-size="11.5" fill="#FFFFFF">How long is the inverter warranty?</text>
  <rect x="88" y="90" width="200" height="30" rx="15" fill="#FFFFFF" stroke="#D9D2C5"/>
  <text x="188" y="110" text-anchor="middle" font-size="11.5" fill="#0F2A43">8 years from commissioning</text>
  <rect x="24" y="130" width="150" height="30" rx="15" fill="#0F2A43"/>
  <text x="99" y="150" text-anchor="middle" font-size="11.5" fill="#FFFFFF">and for the battery?</text>
  <rect x="88" y="170" width="200" height="30" rx="15" fill="#FFFFFF" stroke="#D9D2C5"/>
  <text x="188" y="190" text-anchor="middle" font-size="11.5" fill="#0F2A43">7 years or 4,000 cycles</text>
  <text x="24" y="226" font-size="10.5" fill="#475569">identified by a thread_id</text>

  <!-- checkpoint store -->
  <rect x="372" y="20" width="190" height="86" rx="12" fill="#F1EBFD" stroke="#6D28D9" stroke-width="2"/>
  <text x="467" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">SQLite checkpoints</text>
  <text x="467" y="72" text-anchor="middle" font-size="10.5" fill="#475569">state saved after every step</text>
  <text x="467" y="88" text-anchor="middle" font-size="10.5" fill="#475569">data/chat_checkpoints.db</text>

  <!-- history -->
  <rect x="372" y="144" width="190" height="86" rx="12" fill="#EEF4FB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="467" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">History window</text>
  <text x="467" y="196" text-anchor="middle" font-size="10.5" fill="#475569">last 8 messages</text>
  <text x="467" y="212" text-anchor="middle" font-size="10.5" fill="#475569">long answers trimmed</text>

  <!-- consumers -->
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#0F2A43">
    <rect x="640" y="20" width="250" height="38" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="765" y="44">Router: chat or support question?</text>
    <rect x="640" y="68" width="250" height="38" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="765" y="92">Search query: what does "it" mean?</text>
    <rect x="640" y="116" width="250" height="38" rx="9" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.6"/>
    <text x="765" y="140">Graders: is the evidence enough?</text>
    <rect x="640" y="164" width="250" height="38" rx="9" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6"/>
    <text x="765" y="188">Answer: written in context</text>
  </g>
  <text x="765" y="226" text-anchor="middle" font-size="10.5" fill="#475569">facts still come only from the evidence</text>

  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#m)">
    <path d="M306 63 H370"/>
    <path d="M467 106 V142"/>
    <path d="M562 187 H600 V39 H638"/>
    <path d="M600 87 H638"/>
    <path d="M600 135 H638"/>
    <path d="M600 183 H638"/>
  </g>
</svg>
