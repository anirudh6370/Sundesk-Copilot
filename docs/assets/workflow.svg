<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803D"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C2410C"/>
    </marker>
  </defs>

  <!-- question -->
  <rect x="340" y="10" width="220" height="40" rx="20" fill="#0F2A43"/>
  <text x="450" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Question in a chat thread</text>

  <!-- 1 route -->
  <rect x="340" y="82" width="220" height="46" rx="9" fill="#EEF4FB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">1 · Route question</text>

  <!-- direct answer -->
  <rect x="640" y="82" width="200" height="46" rx="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="740" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#0F2A43">Direct answer</text>
  <text x="740" y="119" text-anchor="middle" font-size="10.5" fill="#475569">from chat history, no search</text>

  <!-- 2 follow-up -->
  <rect x="340" y="164" width="220" height="46" rx="9" fill="#EEF4FB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="450" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">2 · Follow-up search query</text>
  <text x="450" y="201" text-anchor="middle" font-size="10.5" fill="#475569">only when there are earlier turns</text>

  <!-- 3 retrieve -->
  <rect x="340" y="246" width="220" height="46" rx="9" fill="#E8F6EC" stroke="#15803D" stroke-width="2"/>
  <text x="450" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">3 · Retrieve from private KB</text>
  <text x="450" y="283" text-anchor="middle" font-size="10.5" fill="#475569">top 4 chunks from Pinecone</text>

  <!-- 4 grade kb -->
  <rect x="340" y="328" width="220" height="46" rx="23" fill="#F1EBFD" stroke="#6D28D9" stroke-width="2"/>
  <text x="450" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">4 · Grade private evidence</text>

  <!-- answer kb -->
  <rect x="50" y="328" width="200" height="46" rx="9" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <text x="150" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#0F2A43">Answer from private KB</text>
  <text x="150" y="365" text-anchor="middle" font-size="10.5" fill="#475569">cites the company documents</text>

  <!-- 5 web -->
  <rect x="340" y="410" width="220" height="46" rx="9" fill="#FFF7E6" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">5 · Tavily web search</text>
  <text x="450" y="447" text-anchor="middle" font-size="10.5" fill="#475569">top 5 public results</text>

  <!-- 6 grade web -->
  <rect x="340" y="492" width="220" height="46" rx="23" fill="#F1EBFD" stroke="#6D28D9" stroke-width="2"/>
  <text x="450" y="520" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">6 · Grade web evidence</text>

  <!-- answer web -->
  <rect x="50" y="492" width="200" height="46" rx="9" fill="#FFEDD5" stroke="#C2410C" stroke-width="2"/>
  <text x="150" y="513" text-anchor="middle" font-size="13" font-weight="700" fill="#0F2A43">Answer from web</text>
  <text x="150" y="529" text-anchor="middle" font-size="10.5" fill="#475569">with a "verify first" warning</text>

  <!-- 7 rewrite -->
  <rect x="640" y="492" width="200" height="46" rx="9" fill="#FFF7E6" stroke="#D97706" stroke-width="2"/>
  <text x="740" y="513" text-anchor="middle" font-size="13" font-weight="700" fill="#0F2A43">7 · Rewrite query</text>
  <text x="740" y="529" text-anchor="middle" font-size="10.5" fill="#475569">one retry only</text>

  <!-- insufficient -->
  <rect x="340" y="592" width="220" height="46" rx="9" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
  <text x="450" y="613" text-anchor="middle" font-size="13" font-weight="700" fill="#0F2A43">Insufficient evidence</text>
  <text x="450" y="629" text-anchor="middle" font-size="10.5" fill="#475569">says so instead of guessing</text>

  <!-- 8 finalize -->
  <rect x="50" y="700" width="790" height="50" rx="10" fill="#0F2A43"/>
  <text x="445" y="722" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">8 · Save answer, sources and trace to the chat thread</text>
  <text x="445" y="739" text-anchor="middle" font-size="10.5" fill="#CBD5E1">SQLite checkpoint · audit row · LangSmith trace</text>

  <!-- neutral arrows -->
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M450 50 V80"/>
    <path d="M560 105 H638"/>
    <path d="M450 128 V162"/>
    <path d="M450 210 V244"/>
    <path d="M450 292 V326"/>
    <path d="M450 456 V490"/>
    <path d="M740 492 V269 H562"/>
    <path d="M450 638 V698"/>
    <path d="M150 538 V698"/>
    <path d="M50 351 H24 V725 H48"/>
    <path d="M840 105 H872 V725 H842"/>
  </g>
  <!-- good arrows -->
  <g stroke="#15803D" stroke-width="2" fill="none" marker-end="url(#ag)">
    <path d="M340 351 H252"/>
    <path d="M340 515 H252"/>
  </g>
  <!-- weak arrows -->
  <g stroke="#C2410C" stroke-width="2" fill="none" marker-end="url(#ao)">
    <path d="M450 374 V408"/>
    <path d="M560 515 H638"/>
    <path d="M450 538 V590"/>
  </g>

  <!-- labels -->
  <g font-size="11" font-weight="700">
    <text x="296" y="343" text-anchor="middle" fill="#15803D">GOOD</text>
    <text x="296" y="507" text-anchor="middle" fill="#15803D">GOOD</text>
    <text x="458" y="396" fill="#C2410C">WEAK</text>
    <text x="599" y="507" text-anchor="middle" fill="#C2410C">WEAK</text>
    <text x="458" y="562" fill="#C2410C">WEAK</text>
  </g>
  <g font-size="10.5" fill="#475569">
    <text x="599" y="97" text-anchor="middle">chat</text>
    <text x="458" y="150">support question</text>
    <text x="599" y="530" text-anchor="middle">first try</text>
    <text x="458" y="576">after the retry</text>
    <text x="748" y="390">search again</text>
  </g>
</svg>
