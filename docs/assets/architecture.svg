<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/>
    </marker>
  </defs>

  <!-- layer bands -->
  <rect x="0" y="12" width="960" height="106" rx="10" fill="#FFF7E6"/>
  <rect x="0" y="136" width="960" height="88" rx="10" fill="#EEF4FB"/>
  <rect x="0" y="242" width="960" height="146" rx="10" fill="#F1EBFD"/>
  <rect x="0" y="406" width="960" height="122" rx="10" fill="#E8F6EC"/>

  <g font-size="11" font-weight="700" letter-spacing="1.2">
    <text x="18" y="70" fill="#B45309">INTERFACES</text>
    <text x="18" y="185" fill="#1D4ED8">API</text>
    <text x="18" y="320" fill="#6D28D9">AGENT</text>
    <text x="18" y="472" fill="#15803D">SERVICES</text>
  </g>

  <!-- interfaces -->
  <rect x="150" y="30" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="275" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#0F2A43">Streamlit chat UI</text>
  <text x="275" y="80" text-anchor="middle" font-size="11" fill="#475569">threads · sources · trace · upload · port 8501</text>

  <rect x="440" y="30" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="565" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#0F2A43">Basic web UI</text>
  <text x="565" y="80" text-anchor="middle" font-size="11" fill="#475569">HTML · CSS · JavaScript · port 8080</text>

  <!-- api -->
  <rect x="440" y="150" width="250" height="60" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="565" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#0F2A43">FastAPI</text>
  <text x="565" y="195" text-anchor="middle" font-size="11" fill="#475569">/api/chat · /api/ingest · /api/health</text>

  <!-- agent -->
  <rect x="150" y="260" width="540" height="110" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2.5"/>
  <text x="420" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#0F2A43">LangGraph agentic workflow</text>
  <g font-size="11" font-weight="600" fill="#4C1D95" text-anchor="middle">
    <rect x="168" y="306" width="74" height="26" rx="13" fill="#F1EBFD"/><text x="205" y="323">Route</text>
    <rect x="252" y="306" width="78" height="26" rx="13" fill="#F1EBFD"/><text x="291" y="323">Retrieve</text>
    <rect x="340" y="306" width="70" height="26" rx="13" fill="#F1EBFD"/><text x="375" y="323">Grade</text>
    <rect x="420" y="306" width="90" height="26" rx="13" fill="#F1EBFD"/><text x="465" y="323">Web search</text>
    <rect x="520" y="306" width="74" height="26" rx="13" fill="#F1EBFD"/><text x="557" y="323">Rewrite</text>
    <rect x="604" y="306" width="70" height="26" rx="13" fill="#F1EBFD"/><text x="639" y="323">Answer</text>
  </g>
  <text x="420" y="354" text-anchor="middle" font-size="11" fill="#475569">every step reads the chat history of the thread</text>

  <!-- services -->
  <g>
    <rect x="150" y="430" width="125" height="76" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
    <text x="212" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">Groq LLM</text>
    <text x="212" y="479" text-anchor="middle" font-size="10.5" fill="#475569">route · grade · write</text>

    <rect x="288" y="430" width="125" height="76" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
    <text x="350" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">Embeddings</text>
    <text x="350" y="479" text-anchor="middle" font-size="10.5" fill="#475569">local MiniLM · 384-dim</text>

    <rect x="426" y="430" width="125" height="76" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
    <text x="488" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">Pinecone</text>
    <text x="488" y="479" text-anchor="middle" font-size="10.5" fill="#475569">private knowledge base</text>

    <rect x="565" y="430" width="125" height="76" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
    <text x="627" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A43">Tavily</text>
    <text x="627" y="479" text-anchor="middle" font-size="10.5" fill="#475569">web search fallback</text>
  </g>

  <!-- side stores -->
  <rect x="750" y="30" width="190" height="70" rx="10" fill="#0F2A43"/>
  <text x="845" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">LangSmith</text>
  <text x="845" y="80" text-anchor="middle" font-size="11" fill="#CBD5E1">run traces by thread</text>

  <rect x="750" y="262" width="190" height="48" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
  <text x="845" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#0F2A43">Chat checkpoints</text>
  <text x="845" y="299" text-anchor="middle" font-size="10.5" fill="#475569">SQLite · one thread per chat</text>

  <rect x="750" y="322" width="190" height="48" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
  <text x="845" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#0F2A43">Audit log</text>
  <text x="845" y="359" text-anchor="middle" font-size="10.5" fill="#475569">SQLite · one row per question</text>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M275 100 V258"/>
    <path d="M565 100 V148"/>
    <path d="M565 210 V258"/>
    <path d="M212 370 V428"/>
    <path d="M350 370 V428"/>
    <path d="M488 370 V428"/>
    <path d="M627 370 V428"/>
    <path d="M690 286 H748"/>
    <path d="M690 346 H748"/>
  </g>
  <path d="M690 272 H720 V65 H748" stroke="#6D28D9" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowPurple)"/>
  <g font-size="10.5" fill="#475569">
    <text x="283" y="182">direct call</text>
    <text x="573" y="128">POST /api/chat</text>
    <text x="726" y="170" fill="#6D28D9">traces</text>
  </g>
</svg>
